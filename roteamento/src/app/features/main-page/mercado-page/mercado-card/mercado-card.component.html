<div class="card">
    <section class="title">
        <p>{{ value.name }}</p>
    </section>
    <section>
        <p>{{ value.description }}</p>
    </section>
    <section class="info">
        <p>{{ value.quantity }}</p>
        <p class="price">{{ "R$ " + value.price }}</p>
    </section>
    <mat-chip-set>
        <mat-chip>{{ value.store }}</mat-chip>
    </mat-chip-set>
</div>
