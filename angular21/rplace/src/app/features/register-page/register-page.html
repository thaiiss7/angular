<div>
    <app-header></app-header>
    <div class="page-container">
        <div class="form-container">
            <header>
                <h1>Register</h1>
            </header>
            <form class="content" action="post" [formGroup]="loginForm" (ngSubmit)="subscribe()">
                <input type="text" placeholder="Login" formControlName="username">
                <input type="password" placeholder="Password" formControlName="password">
                <input type="password" placeholder="Repeat password" formControlName="repeatPassword">
                <button>Register</button>
                <div class="link">
                    <p>Already have an account?</p>
                    <a href="/">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
