<div class="modal-bg" (click)="close()"></div>
<div class="modal-container">
    <header>
        <div class="title">
            <h1>{{ item?.name }}</h1>
        </div>
        <div class="close" (click)="close()">
            <h2>x</h2>
        </div>
    </header>
    <div class="content">
        <p *ngIf="item?.description">{{ "Descrição: " + item?.description }}</p>
        <p>{{ "Preço: R$" + item?.price }}</p>
    </div>
    <div class="footer">
        <button (click)="close()">Colocar na sacola</button>
    </div>
</div>
